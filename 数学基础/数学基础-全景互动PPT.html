        let currentSlide = 0;
        const totalSlides = slides.length;

        function renderSlide() {
            const container = document.getElementById('slide-container');
            const indicator = document.getElementById('page-indicator');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const slide = slides[currentSlide];

            container.style.opacity = '0';
            container.style.transform = 'translateY(10px)';

            setTimeout(() => {
                container.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-semibold px-3 py-1 rounded-full bg-indigo-950 text-indigo-300 border border-indigo-800/60">${slide.tag}</span>
                            <span class="text-xs text-slate-400 font-mono">${currentSlide + 1} / ${totalSlides}</span>
                        </div>
                        <h2 class="text-lg sm:text-xl font-bold text-white tracking-tight mb-1">${slide.title}</h2>
                        <p class="text-xs sm:text-sm text-slate-400 mb-5">${slide.subtitle}</p>
                    </div>
                    <div class="my-auto">
                        ${slide.render()}
                    </div>
                    <div class="mt-5 pt-3 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-500">
                        <span>提示：可以使用键盘左右方向键 ⬅️ ➡️ 快速翻页</span>
                        <span>LLM 数学基础全景互动课堂</span>
                    </div>
                `;

                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 150);

            indicator.innerText = `第 ${currentSlide + 1} 页 / 共 ${totalSlides} 页`;
            prevBtn.disabled = currentSlide === 0;
            nextBtn.disabled = currentSlide === totalSlides - 1;

            updateDots();

            if (currentSlide === 2) updateTrigDemo(document.getElementById('angle-slider')?.value || 45);
            if (currentSlide === 3) updateLogDemo();
            if (currentSlide === 5) updateDotProduct();
            if (currentSlide === 6) updateSoftmaxDemo();
        }

        function renderDots() {
            const dotContainer = document.getElementById('dot-indicators');
            if (!dotContainer) return;
            dotContainer.innerHTML = '';
            for (let i = 0; i < totalSlides; i++) {
                const dot = document.createElement('button');
                dot.className = `w-2 h-2 rounded-full transition-all ${i === currentSlide ? 'bg-indigo-500 w-5' : 'bg-slate-800 hover:bg-slate-700'}`;
                dot.onclick = () => { currentSlide = i; renderSlide(); };
                dotContainer.appendChild(dot);
            }
        }

        function updateDots() {
            const dotContainer = document.getElementById('dot-indicators');
            if (!dotContainer) return;
            const dots = dotContainer.children;
            for (let i = 0; i < dots.length; i++) {
                dots[i].className = `w-2 h-2 rounded-full transition-all ${i === currentSlide ? 'bg-indigo-500 w-5' : 'bg-slate-800 hover:bg-slate-700'}`;
            }
        }

        function nextSlide() {
            if (currentSlide < totalSlides - 1) { currentSlide++; renderSlide(); }
        }

        function prevSlide() {
            if (currentSlide > 0) { currentSlide--; renderSlide(); }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown') nextSlide();
            if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
        });

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.error(err));
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }

        function updateTrigDemo(val) {
            const angleVal = document.getElementById('angle-val');
            const cosVal = document.getElementById('cos-val');
            const sinVal = document.getElementById('sin-val');
            const point = document.getElementById('circle-point');
            if (!angleVal) return;

            angleVal.innerText = val + '°';
            const rad = (val * Math.PI) / 180;
            const cos = Math.cos(rad);
            const sin = Math.sin(rad);

            cosVal.innerText = cos.toFixed(2);
            sinVal.innerText = sin.toFixed(2);

            const radius = 54;
            const x = Math.cos(rad) * radius;
            const y = -Math.sin(rad) * radius;
            if (point) point.style.transform = `translate(${x}px, ${y}px)`;
        }

        function updateLogDemo() {
            const x = parseInt(document.getElementById('log-x-slider')?.value || 10);
            const y = parseInt(document.getElementById('log-y-slider')?.value || 100);
            if (!document.getElementById('log-x-text')) return;

            document.getElementById('log-x-text').innerText = x;
            document.getElementById('log-y-text').innerText = y;

            document.getElementById('res-mul').innerText = x * y;
            document.getElementById('res-log-sum').innerText = `log₁₀(${x}) + log₁₀(${y}) = ${Math.log10(x).toFixed(2)} + ${Math.log10(y).toFixed(2)} = ${(Math.log10(x) + Math.log10(y)).toFixed(2)}`;
        }

        function updateDotProduct() {
            const a1 = parseFloat(document.getElementById('vec-a1')?.value) || 0;
            const a2 = parseFloat(document.getElementById('vec-a2')?.value) || 0;
            const b1 = parseFloat(document.getElementById('vec-b1')?.value) || 0;
            const b2 = parseFloat(document.getElementById('vec-b2')?.value) || 0;

            const dot = (a1 * b1) + (a2 * b2);
            const resEl = document.getElementById('dot-result');
            if (resEl) resEl.innerText = dot;
        }

        function updateSoftmaxDemo() {
            const sA = parseFloat(document.getElementById('slider-a')?.value) || 0;
            const sB = parseFloat(document.getElementById('slider-b')?.value) || 0;
            if (!document.getElementById('score-a')) return;

            document.getElementById('score-a').innerText = sA;
            document.getElementById('score-b').innerText = sB;

            const expA = Math.exp(sA);
            const expB = Math.exp(sB);
            const sumExp = expA + expB;

            document.getElementById('prob-a').innerText = ((expA / sumExp) * 100).toFixed(1) + '%';
            document.getElementById('prob-b').innerText = ((expB / sumExp) * 100).toFixed(1) + '%';
        }

        window.onload = function() {
            renderDots();
            renderSlide();
        };
    </script>
